<!doctype html>
<meta charset="utf-8" />
<title>infinity-wasm turn</title>
<pre id="out">running…</pre>
<script type="module">
  import init, { run_smoke_turn, run_openai_compatible_turn, state_probe } from "./pkg/infinity_wasm.js";
  const out = document.getElementById("out");
  try {
    await init();
    // The host injects `window.__llm = { baseUrl, apiKey, model }` before load.
    const probe = await state_probe();
    window.__stateResult = { ok: true, probe };
    const llm = window.__llm;
    const reply = llm && llm.apiKey
      ? await run_openai_compatible_turn(
          llm.baseUrl, llm.apiKey, llm.model,
          "Reply with exactly: infinity-browser-openrouter-ok")
      : await run_smoke_turn("hello from the browser");
    out.textContent = "reply: " + reply;
    window.__turnResult = { ok: true, mode: llm && llm.apiKey ? "provider" : "mock", reply };
  } catch (error) {
    out.textContent = "error: " + error;
    window.__turnResult = { ok: false, error: String(error) };
  }
</script>
