[package]
name = "infinity-local-cli"
publish = false
version = "0.1.0"
description = "Desktop CLI for the local-first archetype: one 'device' in the sync end-to-end test."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[[bin]]
name = "local-sync"
path = "src/main.rs"

[dependencies]
infinity-sync = { path = "../crates/infinity-sync", features = ["http"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
uuid = { workspace = true }

[lints]
workspace = true
