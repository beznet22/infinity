[package]
name = "infinity-wasm"
publish = false
version = "0.2.0"
description = "Browser runtime (wasm32-unknown-unknown) for the Infinity hybrid fork."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[dependencies]
infinity-host = { path = "../infinity-host", version = "^0.2.0", default-features = false }
rap-client = { path = "../rap-client", version = "^0.2.0" }
infinity-agent-core = { path = "../infinity-agent-core", version = "^0.2.0" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["time", "macros", "rt"] }

[target.'cfg(target_family = "wasm")'.dependencies]
# `tokio::time` compiles for wasm32-unknown-unknown but panics on first use: there
# is no tokio timer driver in a browser. wasmtimer implements the same API over
# `performance.now()` + `setTimeout`.
wasmtimer = "0.4"

[lints]
workspace = true
