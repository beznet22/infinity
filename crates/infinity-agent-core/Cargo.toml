[package]
name = "infinity-agent-core"
publish = true
version = "0.2.0"
documentation = "https://docs.rs/infinity-agent-core/"
description = "Core time-sliced agent runtime for Infinity: event processing, threads, and tool dispatch."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[dependencies]
rap-client = { path = "../rap-client", version = "^0.2.0" }
rap-protocol = { path = "../rap-protocol", version = "^0.2.0" }
infinity-provider-protocol = { path = "../infinity-provider-protocol", version = "^0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tokio-util = { version = "0.7" }
futures-util = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
chrono = { workspace = true }
chrono-tz = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
rhai = { workspace = true }

# `uuid` needs a randomness source that differs per target: the host uses
# getrandom, while wasm32-unknown-unknown must use the browser's
# `crypto.getRandomValues` via uuid's `js` feature (without it uuid emits a
# compile_error! on this target).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["v4", "js"] }
# rhai -> ahash pulls getrandom 0.3, whose wasm32-unknown-unknown backend is
# opt-in. Enabling `wasm_js` here unifies the feature across the graph (a
# direct dependency is the documented way to enable a transitive crate's
# feature); the matching `--cfg getrandom_backend="wasm_js"` rustflag lives
# in `/.cargo/config.toml`.
getrandom = { version = "0.3", features = ["wasm_js"] }
# `tokio::time` compiles for wasm32-unknown-unknown but panics on first use:
# a browser has no tokio timer driver, and completion retries must not take
# the page down (D18/D36).
wasmtimer = "0.4"

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
libc = "0.2"
infinity-provider-protocol = { path = "../infinity-provider-protocol", version = "^0.2.0", features = ["mock"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
futures-util = { workspace = true, features = ["sink"] }

[lints]
workspace = true
